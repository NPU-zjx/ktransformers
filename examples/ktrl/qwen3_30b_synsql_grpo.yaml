# Qwen3-30B-A3B + SynSQL online GRPO; example defaults to eight ranks.
# Four-rank online validation used TP4/world_size4/GAS4 and an 8192-token context.
algorithm:
  adv_estimator: grpo
  rollout_correction:
    bypass_mode: false
    rollout_is: null
expert_placement:
  strategy: uniform
  gpu_experts_per_layer: 0
actor_rollout_ref:
  model:
    path: /mnt/data/models/Qwen3-30B-A3B
    dtype: bfloat16
  rollout:
    name: sglang
    tp_size: 8
    kt_method: BF16
    kt_cpuinfer: 32
    kt_threadpool_count: 2
    mem_fraction_static: 0.35
  actor:
    strategy: fsdp2
    world_size: 8
    training_scope: full
    nonexpert_parameter_dtype: float32  # GPU FSDP2 FP32 shard high-precision update base.
    reduce_dtype: bfloat16              # Scheme B: BF16 FSDP2 gradient reduction.
    gradient_accumulation_dtype: bfloat16  # Explicit BF16 shard sum across microbatches; FP32 only at clip/update.
    learning_rate: 1.0e-6
    ppo_mini_batch_size: 4
    ppo_epochs: 1
    shuffle: false
    data_loader_seed: 42
    kt_num_threads: 48
    kt_threadpool_count: 1
  ref:
    enabled: false
    strategy: fsdp2
critic:
  enabled: false
  strategy: fsdp2
data:
  train_file: ../../../data/synsql_qwen3_v1/train.parquet
  validation_file: ../../../data/synsql_qwen3_v1/validation.parquet
  prompts_per_step: 8
  responses_per_prompt: 4
  max_prompt_tokens: 6144
  max_response_tokens: 2048
  context_length: 8192
  seed: 42
  overlong_buffer_tokens: 0  # Binary SQL execution reward; no format/length bonus.
trainer:
  steps: 4
  gradient_accumulation_steps: 2
  optimizer_schedule_steps: 200
  save_freq: 2
  keep_full_checkpoints: 2
profiling:
  preset: light

reward:
  name: sql_execution
  database_root: ../../../data/synsql_qwen3_v1/databases
  timeout_seconds: 10.0  # Matches the full-filter reference recheck budget.
  max_rows: 100000
  max_result_bytes: 8388608
  float_abs_tol: 1.0e-6
  float_rel_tol: 1.0e-6
